[autorun]
display_name = "Auto Run"
id = "autorun"
type = "all"
input_device = "controller"
description = "Toggle to lock the left stick forward at 100%. Moving the stick past a threshold automatically cancels."
state_display = "AR"
status_var = "AutoRunStatus"
trigger = "if (AutoRunStatus) {\n    if (isqrt((get_val(PS5_LX) * get_val(PS5_LX)) + (get_val(PS5_LY) * get_val(PS5_LY))) > AutoRunThreshold) {\n        AutoRunStatus = 0;\n        FlowRedraw = TRUE;\n    }\n    set_val(PS5_LY, -100);\n}"
combo = "// Auto Run uses direct set_val, no combo needed"

[[autorun.options]]
name = "Status"
var = "AutoRunStatus"
type = "toggle"
default = 0

[[autorun.options]]
name = "Threshold"
var = "AutoRunThreshold"
type = "value"
min = 50
max = 100
default = 80
